name: Optimized Frontend Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4  # 更新到 v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4  # 更新到 v4
      with:
        node-version: '20'
        # 暂时禁用缓存，直到问题解决
        # cache: 'npm'
    
    # 关键修复：清理 node_modules 和 package-lock.json
    - name: Clean installation files
      run: |
        rm -rf node_modules
        rm -f package-lock.json
    
    # 安装依赖，包括显式安装缺失的原生模块
    - name: Install dependencies
      run: npm i

    
    # # 并行运行 lint 和测试
    # - name: Lint
    #   run: npm run lint
      
    # - name: Test
    #   run: npm test
    
    # 带环境变量的构建
    - name: Build
      env:
        NODE_ENV: production
        REACT_APP_API_URL: ${{ secrets.API_URL }}
      run: npm run build
    
    # 保存构建产物为 artifacts
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: production-build
        path: dist/